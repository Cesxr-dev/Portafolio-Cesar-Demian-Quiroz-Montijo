        <nav>

    <main>
        <!-- Seccion de Proyectos de Software -->
        <section id="desarrollo">
            <h2>Contactame llenando los siguientes campos.</h2>
            <form action="" class="formulario-contacto">
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Cesar Demian Quiroz Montijo" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Correo electronico:</label>
                    <input type="text" id="email" name="email" placeholder="Ej. cesar123@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Ej. Solicitud de servicio" required>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea type="text" id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje" required></textarea>
                </div>
                    
                <div>
                    <button type="submit" class="btn-enviar">
                        <span>Enviar</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256">
                            <path d="M231.87,114l-168-95.89A16,16,0,0,0,40.92,37.34L71.55,128,40.92,218.67A16,16,0,0,0,56,240a16.15,16.15,0,0,0,7.93-2.1l167.92-96.05a16,16,0,0,0,.05-27.89ZM56,224a.56.56,0,0,0,0-.12L85.74,136H144a8,8,0,0,0,0-16H85.74L56.06,32.16A.46.46,0,0,0,56,32l168,95.83Z"></path>
                        </svg>
                    </button>
                </div>
                
                

                

                
            </form>
            
        </section>
